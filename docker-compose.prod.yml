# Самодостаточный стек для Portainer (Stacks → Add stack → Repository).
#
# Portainer клонирует репозиторий, билдит образ из Dockerfile и поднимает бота
# в режиме webhook. Секреты (токены, WEBHOOK_*) задаются НЕ в этом файле, а в
# разделе "Environment variables" стека Portainer — оттуда подставляются в
# ${...} ниже. В репозитории .env нет (он в .gitignore), поэтому все нужные
# переменные прокидываем в контейнер явно через environment.
#
# Требования на хосте:
#   - внешняя сеть `proxy` (та же, где cloudflared) — уже существует;
#   - в Cloudflare Zero Trust: Public Hostname flights.domitin.ru →
#     http://flight-monitor-bot:8443
#
# Portainer stack env vars (обязательные):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, WEBHOOK_URL, WEBHOOK_SECRET
services:
  bot:
    build: .
    image: flight-monitor:latest
    container_name: flight-monitor-bot
    restart: unless-stopped
    environment:
      # --- секреты из stack env Portainer ---
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      WEBHOOK_URL: ${WEBHOOK_URL}          # напр. https://flights.domitin.ru/<путь>
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}    # длинная случайная строка
      # --- режим и инфраструктура ---
      BOT_MODE: webhook
      WEBHOOK_PORT: "8443"                 # cloudflared ходит на этот порт по сети proxy
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: "900"
      MONITOR_DB_PATH: /app/data/prices.db
      TZ: Europe/Moscow
    depends_on:
      - redis
    volumes:
      - prices-data:/app/data
    networks:
      - default   # связь bot ↔ redis (сеть стека по умолчанию)
      - proxy     # общая сеть с cloudflared (резолв flight-monitor-bot:8443)

  redis:
    image: redis:7-alpine
    container_name: flight-monitor-redis
    restart: unless-stopped
    networks:
      - default

networks:
  proxy:
    external: true   # уже существует на сервере, создаётся не нами

volumes:
  prices-data:
